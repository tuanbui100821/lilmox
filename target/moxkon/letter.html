<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For You</title>
    <link href="https://fonts.googleapis.com/css?family=Pacifico|Dancing+Script:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #fdf5e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .letter-container {
            width: 90%;
            max-width: 600px;
            background: #fff;
            padding: 60px 50px 50px 70px;
            box-shadow: 20px 20px 60px #d9d4c7;
            border-radius: 2px;
            position: relative;
            min-height: 450px;
            box-sizing: border-box;
        }

        /* Lề giấy kẻ dọc */
        .letter-container::before {
            content: '';
            position: absolute;
            top: 0; left: 50px;
            width: 2px; height: 100%;
            background: rgba(255, 0, 0, 0.2);
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }

        #typewriter {
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            line-height: 1.6;
            color: #000000;
            white-space: pre-wrap;
            position: relative;
            display: inline;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        #pen {
            position: absolute;
            width: 50px;
            height: 20px;
            background-image: url('https://png.pngtree.com/png-vector/20240310/ourmid/pngtree-black-and-gold-fountain-pen-png-image_11927367.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
            pointer-events: none;
            transform: translate(-5px, -35px);
            transition: all 0.1s linear;
        }

        .pen-writing {
            animation: write-move 0.1s infinite alternate;
        }

        @keyframes write-move {
            from { transform: translate(-5px, -35px) rotate(0deg); }
            to { transform: translate(-3px, -37px) rotate(3deg); }
        }

        .signature {
            margin-top: 50px;
            text-align: right;
            font-family: 'Dancing Script', cursive;
            font-size: 30px;
            color: #000;
            opacity: 0;
            transition: opacity 2s;
        }

        .show-signature { opacity: 1; }
    </style>
</head>
<body>
<audio id="bg-music" src="./mp3/Michael%20Jackson%20-%20Love%20Never%20Felt%20So%20Good%20(Official%20Video).mp3" autoplay loop></audio>
<div id="app-container">
    <div class="letter-container">
        <h1>Gửi em...</h1>

        <span id="typewriter"></span>
        <div id="pen"></div>

        <div class="signature" id="signature">Yêu em nhiều, <br> Ba Sữa ❤️</div>
    </div>
</div>

<script>
    const text = "Shakespear từng nói trong A Midsummer Night rằng: \"The course of true love never did run smooth\"" +
        " theo ý anh hiểu nghĩa là \"Dòng chảy của tình yêu đích thực chẳng bao giờ lặng lẽ êm đềm.\"" +
        " \n Anh biết mình không phải là người khéo léo, tình yêu của anh cũng có phần vụng về, thô ráp nhưng anh " +
        "vẫn đang cố gắng từng ngày " +
        ", mài giũa bản thân từng chút một, để không chỉ hoàn thiện mình, mà còn để yêu em một cách trọn vẹn nhất..\n" +
        "Cảm ơn em đã kiên nhẫn với những lần anh đá bóng muộn, " +
        "cảm ơn em đã cùng anh chia sẻ những bản nhạc hay, " +
        "cảm ơn những bữa cơm ngon em nấu cho anh và Vinh ," +
        "cảm ơn những lần đã rơi nước mắt vì anh , " +
        "cảm ơn những sự quan tâm vỗ về của em trong suốt thời gian qua , " +
        "cảm ơn vì sau tất cả đã không ngừng kiên nhẫn" +
        " và cảm ơn em vì đã là một phần không thể thiếu trong cuộc đời anh." +
        " Dù sau này thế nào, mình cũng cứ nắm tay nhau thật chặt nhé em  !";

    let index = 0;
    const speed = 110;
    const typewriterElement = document.getElementById('typewriter');
    const pen = document.getElementById('pen');
    const signatureElement = document.getElementById('signature');

    function typeWriter() {
        if (index < text.length) {
            pen.classList.add('pen-writing');
            typewriterElement.innerText += text.charAt(index);
            updatePenPosition();
            index++;
            setTimeout(typeWriter, speed);
        } else {
            pen.classList.remove('pen-writing');
            pen.style.display = "none";
            signatureElement.classList.add('show-signature');
        }
    }

    function updatePenPosition() {
        const range = document.createRange();
        range.selectNodeContents(typewriterElement);
        const rects = range.getClientRects();
        const lastRect = rects[rects.length - 1];

        if (lastRect) {
            const containerRect = document.querySelector('.letter-container').getBoundingClientRect();
            pen.style.left = (lastRect.right - containerRect.left) + "px";
            pen.style.top = (lastRect.bottom - containerRect.top) + "px";
        }
    }

    // Bắt đầu viết sau 1.5 giây khi trang tải xong
    setTimeout(typeWriter, 1500);
</script>
</body>
</html>
