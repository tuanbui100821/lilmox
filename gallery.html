<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ niệm của tụi mình</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body { overflow-y: auto !important; } /* Cho phép cuộn trang */
        .gallery-container {
            padding: 50px 20px;
            text-align: center;
            z-index: 2;
            position: relative;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .photo-grid img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            border: 5px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .photo-grid img:hover {
            transform: scale(1.05);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
        }
    </style>
</head>
<body>
<div class="bgoverlay">
    <div class="gallery-container">
        <a href="index.html" class="back-btn">⬅ Quay lại thiệp</a>
        <h1 style="font-size: 40px; margin-bottom: 40px;">Our Gallery</h1>

        <div class="photo-grid">
            <div class="photo-grid">
                <img src="../gallery/28398930-bd70-4b60-a293-02144cb0dd52.jpg" alt="Kỷ niệm 1">
                <img src="../gallery/5f0f8566-0608-4846-a674-b4cf8018b3d7.jpg" alt="Kỷ niệm 2">
                <img src="../gallery/8d241f66-24d9-41bd-b5bd-ffc16888333b.jpg" alt="Kỷ niệm 3">
                <img src="../gallery/a3936549-32a4-4685-9826-2c272eee1e8a.jpg" alt="Kỷ niệm 4">
                <img src="../gallery/c370ea88-4dac-4e47-ba84-f4fe856a78a5.jpg" alt="Kỷ niệm 5">
                <img src="../gallery/ca261da4-5eaf-4f83-a105-9c6de4db3590.jpg" alt="Kỷ niệm 6">
            </div>
        </div>
    </div>
</div>
</body>
</html>
