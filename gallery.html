<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0; padding: 0;
            height: auto !important;
            overflow-y: auto !important;
            scroll-behavior: smooth;
        }
        .bgoverlay {
            min-height: 100vh;
            height: auto !important;
            background-attachment: fixed;
            position: relative;
            background-size: cover;
            overflow: hidden;
        }

        /* Hiệu ứng Floating Hearts */
        .heart {
            position: fixed;
            color: #ff4d6d;
            font-size: 20px;
            pointer-events: none;
            z-index: 0;
            animation: fly 10s linear infinite;
            opacity: 0.6;
        }
        @keyframes fly {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .gallery-container { padding: 50px 20px; text-align: center; position: relative; z-index: 2; }

        /* Hiệu ứng trượt ảnh khi load */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 100px;
        }
        .photo-grid img {
            z-index: 3 !important;
            width: 100%; height: 350px; object-fit: cover;
            border-radius: 15px; border: 5px solid ;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            opacity: 0; transform: translateY(30px); /* Gốc để diễn hoạt */
        }
        .photo-grid img.show { opacity: 1; transform: translateY(0); }
        .photo-grid img:hover { transform: scale(1.05) rotate(1deg); border-color: #ff4d6d; }

        /* Lightbox - Phóng to ảnh */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        #lightbox img { max-width: 90%; max-height: 85%; border-radius: 10px; border: 3px solid #fff; }

        h1 { font-family: 'Pacifico', cursive; font-size: 50px; color: white; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .back-btn {
            display: inline-block; margin-bottom: 20px; color: #fff;
            text-decoration: none; background: rgba(255, 77, 109, 0.7);
            padding: 10px 25px; border-radius: 30px; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="bgoverlay">
    <div id="heart-container"></div>
    <div class="gallery-container">
        <a href="index.html" class="back-btn">⬅ Back</a>
        <h1>Our Memories</h1>
        <div class="photo-grid" id="image-gallery"></div>
    </div>
</div>

<div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="">
</div>

<script>
    const galleryGrid = document.getElementById('image-gallery');
    const folderPath = "./gallery/";

    // 1. Tự động nạp ảnh Windows "1 (n).jpg"
    function tryLoadImage(index) {
        const img = new Image();
        const fileName = `1 (${index}).jpg`;
        img.src = folderPath + fileName;

        img.onload = function() {
            const imgElement = document.createElement('img');
            imgElement.src = img.src;
            imgElement.onclick = () => {
                document.getElementById('lightbox-img').src = img.src;
                document.getElementById('lightbox').style.display = 'flex';
                isAutoScrolling = false; // Dừng cuộn khi đang xem ảnh
            };
            galleryGrid.appendChild(imgElement);

            // Hiệu ứng hiện dần cho từng ảnh
            setTimeout(() => imgElement.classList.add('show'), index * 100);

            tryLoadImage(index + 1);
        };

        img.onerror = function() {
            if(index > 1) startAutoScroll();
        };
    }

    // 2. Tự động cuộn
    let scrollSpeed = 0.8;
    let isAutoScrolling = true;

    function startAutoScroll() {
        function scroll() {
            if (isAutoScrolling) {
                window.scrollBy(0, scrollSpeed);
                if ((window.innerHeight + window.pageYOffset) >= document.body.offsetHeight - 2) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
            requestAnimationFrame(scroll);
        }
        setTimeout(scroll, 2000);
    }

    // 3. Hiệu ứng tim bay
    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
        document.getElementById('heart-container').appendChild(heart);
        setTimeout(() => heart.remove(), 10000);
    }
    setInterval(createHeart, 800);

    // Tương tác người dùng
    window.addEventListener("wheel", () => isAutoScrolling = false);
    window.addEventListener("touchstart", () => isAutoScrolling = false);

    tryLoadImage(1);
</script>
</body>
</html>
