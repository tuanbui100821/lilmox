<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ niệm của tụi mình</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0; padding: 0;
            height: auto !important;
            overflow-y: auto !important;
        }
        .bgoverlay {
            min-height: 100vh;
            height: auto !important;
            background-attachment: fixed;
            position: relative;
            background-size: cover;
        }
        .gallery-container { padding: 50px 20px; text-align: center; }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 100px;
        }
        .photo-grid img {
            width: 100%; height: 350px; object-fit: cover;
            border-radius: 15px; border: 6px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s ease;
        }
        .photo-grid img:hover { transform: translateY(-5px); }
        h1 { font-family: 'Pacifico', cursive; font-size: 45px; color: white; margin-bottom: 40px; }
        .back-btn {
            display: inline-block; margin-bottom: 20px; color: #fff;
            text-decoration: none; background: rgba(0,0,0,0.3);
            padding: 10px 20px; border-radius: 30px; font-family: sans-serif;
        }
    </style>
</head>
<body>

<div class="bgoverlay">
    <div class="gallery-container">
        <a href="index.html" class="back-btn">⬅ Quay lại trang chủ</a>
        <h1>Our Memories</h1>
        <div class="photo-grid" id="image-gallery"></div>
    </div>
</div>

<script>
    const galleryGrid = document.getElementById('image-gallery');
    const folderPath = "./gallery/";

    // Hàm nạp ảnh theo định dạng Windows: "1 (n).jpg"
    function tryLoadImage(index) {
        const img = new Image();

        // Theo hình bạn gửi, ảnh đầu tiên có thể là "1 (1).jpg"
        // Nếu file đầu tiên của bạn chỉ là "1.jpg", hãy đổi tên nó thành "1 (1).jpg" cho đồng bộ
        const fileName = `1 (${index}).jpg`;
        img.src = folderPath + fileName;

        img.onload = function() {
            const imgElement = document.createElement('img');
            imgElement.src = img.src;
            imgElement.loading = "lazy";
            galleryGrid.appendChild(imgElement);

            // Tiếp tục tìm ảnh (2), (3)...
            tryLoadImage(index + 1);
        };

        img.onerror = function() {
            // Khi không tìm thấy số tiếp theo, bắt đầu cuộn trang
            console.log("Đã tải xong toàn bộ ảnh hiện có.");
            if(index > 1) startAutoScroll();
        };
    }

    // --- TỰ ĐỘNG CUỘN VÔ TẬN ---
    let scrollSpeed = 0.8;
    let isAutoScrolling = true;

    function startAutoScroll() {
        function scroll() {
            if (isAutoScrolling) {
                window.scrollBy(0, scrollSpeed);
                // Nếu cuộn hết trang thì quay lại đầu
                if ((window.innerHeight + window.pageYOffset) >= document.body.offsetHeight - 2) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
            requestAnimationFrame(scroll);
        }
        setTimeout(scroll, 2000); // Đợi 2 giây cho người dùng chuẩn bị
    }

    // Tắt tự động cuộn nếu người dùng chủ động chạm/cuộn chuột
    window.addEventListener("wheel", () => isAutoScrolling = false);
    window.addEventListener("touchstart", () => isAutoScrolling = false);
    window.addEventListener("mousedown", () => isAutoScrolling = false);

    // Bắt đầu chạy từ ảnh số (1)
    tryLoadImage(1);
</script>
</body>
</html>
